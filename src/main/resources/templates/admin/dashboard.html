<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 대시보드</title>
</head>
<body>

<h1>관리자 대시보드</h1>

<h2>오류신고 현황</h2>

<table border="1">
    <tr>
        <th>전체 신고</th>
        <td th:text="${dashboard.totalCount}">0</td>
    </tr>
    <tr>
        <th>접수</th>
        <td th:text="${dashboard.receivedCount}">0</td>
    </tr>
    <tr>
        <th>처리중</th>
        <td th:text="${dashboard.inprogressCount}">0</td>
    </tr>
    <tr>
        <th>완료</th>
        <td th:text="${dashboard.completedCount}">0</td>
    </tr>
    <tr>
        <th>반려</th>
        <td th:text="${dashboard.rejectedCount}">0</td>
    </tr>
</table>

<h2>답변 현황</h2>

<table border="1">
    <tr>
        <th>미답변</th>
        <td th:text="${dashboard.unansweredCount}">0</td>
    </tr>
    <tr>
        <th>답변 완료</th>
        <td th:text="${dashboard.answeredCount}">0</td>
    </tr>
</table>

<br>

<a th:href="@{/admin/reports}">오류신고 목록으로</a>

<br>

<a th:href="@{/}">메인으로</a>
</body>
</html>
