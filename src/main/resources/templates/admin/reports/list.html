<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 오류신고 목록</title>
</head>
<body>
<h1>관리자 오류신고 목록</h1>

<a th:href="@{/}">메인으로</a>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>작성자</th>
        <th>제목</th>
        <th>처리상태</th>
        <th>답변여부</th>
        <th>등록일시</th>
        <th>상세</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="report : ${reports}">
        <td th:text="${report.id}">1</td>
        <td th:text="${report.user.name}">작성자</td>
        <td>
            <a th:href="@{/admin/reports/{id}(id=${report.id})}"
               th:text="${report.title}">제목</a>
        </td>
        <td>
            <span th:if="${report.status.name() == 'RECEIVED'}">접수</span>
            <span th:if="${report.status.name() == 'IN_PROGRESS'}">처리중</span>
            <span th:if="${report.status.name() == 'COMPLETED'}">완료</span>
        </td>
        <td>
            <span th:if="${report.status.name() == 'COMPLETED'}">답변완료</span>
            <span th:if="${report.status.name() != 'COMPLETED'}">미답변</span>
        </td>
        <td th:text="${report.createdAt}">2026-05T10:00</td>
        <td>
            <a th:href="@{/admin/reports/{id}(id=${report.id})}">상세보기</a>
        </td>
    </tr>
    </tbody>
</table>

<p th:if="${#lists.isEmpty(reports)}">등록된 오류신고가 없습니다.</p>

</body>
</html>
