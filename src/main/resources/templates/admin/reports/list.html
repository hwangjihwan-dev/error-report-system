<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 오류신고 목록</title>
</head>
<body>
<h1>관리자 오류신고 목록</h1>

<a th:href="@{/}">메인으로</a>
<div>
    <a th:href="@{/admin/reports}"
       th:style="${selectedStatus == null} ? 'font-weight:bold;' : ''">
        전체
    </a>
    <span th:each="status : ${statuses}">
        <a  th:href="@{/admin/reports(status=${status}, keyword=${keyword})}"
            th:text="${status.description}"
            th:style="${selectedStatus == null} ? 'font-weight:bold;' : ''">
        처리상태
        </a>
    </span>
</div>
<form th:action="@{/admin/reports}" method="get">
    <input type="hidden" name="status" th:value="${selectedStatus}">
    <input type="text"
           name="keyword"
           th:value="${keyword}"
           placeholder="제목 또는 내용 검색">
    <button type="submit">검색</button>

    <a th:href="@{/admin/reports}">초기화</a>
</form>
<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>작성자</th>
        <th>제목</th>
        <th>처리상태</th>
        <th>답변여부</th>
        <th>등록일시</th>
        <th>상세</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="report : ${reports}">
        <td th:text="${report.id}">1</td>
        <td th:text="${report.user.name}">작성자</td>
        <td>
            <a th:href="@{/admin/reports/{id}(id=${report.id})}"
               th:text="${report.title}">제목</a>
        </td>
        <td th:text="${report.status.description}">접수</td>
        <td>
            <span th:if="${report.answer != null}">답변완료</span>
            <span th:if="${report.answer == null}">미답변</span>
        </td>
        <td th:text="${report.createdAt}">2026-05T10:00</td>
        <td>
            <a th:href="@{/admin/reports/{id}(id=${report.id})}">상세보기</a>
        </td>
    </tr>
    </tbody>
</table>
<div th:if="${reportPage.totalElements > 0}">
    <a th:if="${reportPage.hasPrevious()}"
       th:href="@{/admin/reports(page=${reportPage.number - 1}, status=${selectedStatus}, keyword=${keyword})}">
        이전
    </a>
    <span>
        <span th:text="${reportPage.number + 1}">1</span>
        /
        <span th:text="${reportPage.totalPages}">1</span>
    </span>

    <a th:if="${reportPage.hasNext()}"
       th:href="@{/admin/reports(page=${reportPage.number + 1}, status=${selectedStatus}, keyword=${keyword})}">
        다음
    </a>
</div>

<p th:if="${#lists.isEmpty(reports)}">등록된 오류신고가 없습니다.</p>

</body>
</html>
