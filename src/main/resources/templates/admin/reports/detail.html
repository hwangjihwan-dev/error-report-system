<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 오류신고 상세</title>
</head>
<body>
<h1>관리자 오류신고 상세</h1>

<table border="1">
    <tr>
        <td>ID</td>
        <td th:text="${report.id}">1</td>
    </tr>
    <tr>
        <th>제목</th>
        <td th:text="${report.title}">제목</td>
    </tr>
    <tr>
        <th>첨부파일</th>
        <td>
            <span th:if="${!report.hasAttachment()}">
                첨부파일 없음
            </span>

            <a th:if="${report.hasAttachment()}"
               th:href="@{/admin/reports/{id}/attachment(id=${report.id})}"
               th:text="${report.originalFileName}">
                첨부파일 다운로드
            </a>
        </td>
    </tr>
    <tr>
        <th>내용</th>
        <td th:text="${report.content}">내용</td>
    </tr>
    <tr>
        <th>처리상태</th>
        <td th:text="${report.status.description}">접수</td>
    </tr>
    <tr>
        <th>작성자</th>
        <td th:text="${report.user.loginId}">test</td>
    </tr>
    <tr>
        <th>작성일</th>
        <td th:text="${report.createdAt}">2026-06-06</td>
    </tr>
    <tr>
        <th>수정일</th>
        <td th:text="${report.updatedAt}">2026-06-06</td>
    </tr>
    <tr>
        <th>관리자 답변</th>
        <td th:text="${report.answer != null ? report.answer : '아직 답변이 없습니다.'}">아직 답변이 없습니다.</td>
    </tr>
    <tr>
        <th>답변일</th>
        <td th:text="${report.answeredAt != null ? report.answeredAt : '-'}">2026-06-06</td>
    </tr>
    <tr th:if="${report.status.name() == 'REJECTED'}">
        <th>반려 사유</th>
        <td th:text="${report.rejectReason}">반려 사유</td>
    </tr>
    <tr th:if="${report.status.name() == 'REJECTED'}">
        <th>반려 처리일</th>
        <td th:text="${report.answeredAt != null ? report.answeredAt : '-'}">2026-08-18</td>
    </tr>
</table>

<div th:if="${report.answer == null and report.status.name() != 'REJECTED'}">
    <h2>관리자 답변 등록</h2>

    <form th:action="@{/admin/reports/{id}/answer(id=${report.id})}"
          th:object="${reportAnswerRequest}"
          method="post">
        <div>
            <label for="answer">답변 내용</label><br>

            <textarea id="answer"
                      th:field="*{answer}"
                      rows="8"
                      cols="80"
                      placeholder="답변 내용을 입력하세요">
            </textarea>
            <div th:if="${#fields.hasErrors('answer')}"
                 th:errors="*{answer}">
                답변 오류 메시지
            </div>
        </div>
        <div>
            <label for="statusCreate">처리상태</label><br>

            <select id="statusCreate" th:field="*{status}">
                <option th:each="status : ${statuses}"
                        th:value="${status}"
                        th:text="${status.description}">
                    접수
                </option>
            </select>
            <div th:if="${#fields.hasErrors('status')}"
                 th:errors="*{status}">
                처리상태 오류 메시지
            </div>
        </div>
        <br>
        <button type="submit">답변등록</button>
    </form>
</div>
<div th:if="${#strings.isEmpty(report.answer) and report.status.name() != 'REJECTED'}">
    <h3>반려 처리</h3>

    <form th:action="@{/admin/reports/{id}/reject(id=${report.id})}"
          th:object="${reportRejectRequest}"
          method="post">

        <div>
            <label for="rejectReason">
                반려 사유
            </label><br>
            <textarea id="rejectReason"
                      th:field="*{rejectReason}"
                      rows="5"
                      cols="80"
                      placeholder="반려 사유를 입력하세요"></textarea>
            <div th:if="${#fields.hasErrors('rejectReason')}"
                 th:errors="*{rejectReason}" >
                반려 사유 오류 메시지
            </div>
            <button type="submit"
                    onclick="return confirm('해당 오류신고를 반려처리하시겠습니까?')">
                반려 처리
            </button>
        </div>

    </form>

</div>
<div th:if="${report.answer != null}">
    <h2>관리자 답변 수정</h2>

    <form th:action="@{/admin/reports/{id}/answer/edit(id=${report.id})}"
          th:object="${reportAnswerRequest}"
          method="post">
        <div>
            <label for="answerEdit">답변 내용</label><br>

            <textarea id="answerEdit"
                      th:field="*{answer}"
                      rows="8"
                      cols="80"
                      placeholder="답변 내용을 입력하세요">
            </textarea>
            <div th:if="${#fields.hasErrors('answer')}"
                 th:errors="*{answer}">
                답변 오류 메시지
            </div>
            <div>
                <label for="statusEdit">처리상태</label><br>
                <select id="statusEdit" th:field="*{status}">
                    <option th:each="status : ${statuses}"
                            th:value="${status}"
                            th:text="${status.description}">
                        접수
                    </option>
                </select>
                <div th:if="${#fields.hasErrors('status')}"
                     th:errors="*{status}">
                    처리상태 오류 메시지
                </div>
            </div>
        </div>
        <br>
        <button type="submit">답변수정</button>
    </form>
</div>

<a th:href="@{/admin/reports}">목록으로</a>

</body>
</html>
