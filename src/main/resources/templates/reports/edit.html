<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>오류신고 수정</title>
</head>
<body>
<h1>오류신고 수정</h1>

<form th:action="@{/reports/{id}/edit(id=${report.id})}"
      th:object="${reportUpdateRequest}"
      method="post"
      enctype="multipart/form-data">
    <div>
        <label for="title">제목</label><br>
        <input type ="text"
               id="title"
               th:field="*{title}"
               placeholder="제목을 입력하세요">
        <div th:if="${#fields.hasErrors('title')}"
             th:errors="*{title}">
            제목 오류 메시지
        </div>
    </div>

    <br>
    <div>
        <label for="content">내용</label><br>
        <textarea id="content"
                  th:field="*{content}"
                    rows="10"
                    cols="80"
                    placeholder="내용을 입력하세요"></textarea>
        <div th:if="${#fields.hasErrors('content')}"
            th:errors="*{content}">
            내용 오류 메시지
        </div>
    </div>
    <div>
        <strong>현재 첨부파일</strong>
        <span th:if="${!report.hasAttachment()}">
            첨부파일 없음
        </span>
        <div id="currentAttachment" th:if="${report.hasAttachment()}">
            <span th:text="${report.originalFileName}">
                기존 첨부파일명
            </span>
            <button type="button" onclick="markDeleteAttachment()">
                첨부파일 삭제
            </button>
        </div>
        <p id="deleteAttachmentMessage" style="display:none;">
            기존 첨부파일이 삭제 대상으로 표시되었습니다. 수정 버튼을 누르면 삭제됩니다.
        </p>
        <input type="hidden" id="deleteAttachment" name="deleteAttachment" value="false">
    </div>
    <div>
        <label for="file">새 첨부파일</label>
        <input type="file" id="file" name="file">
        <p>새 파일을 선택하지 않으면 기존 첨부파일이 유지됩니다.</p>
    </div>

    <br>

    <button type="submit">수정</button>
    <a th:href="@{/reports/{id}(id=${report.id})}">취소</a>
</form>
<script>
    function markDeleteAttachment() {
        document.getElementById("deleteAttachment").value = "true";
        document.getElementById("currentAttachment").style.display = "none";
        document.getElementById("deleteAttachmentMessage").style.display = "block";
    }
</script>
</body>

</html>
