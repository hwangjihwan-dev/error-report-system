<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>오류신고 상세</title>
</head>
<body>
<h1>오류신고 상세</h1>

<div>
    <p><strong>ID:</strong> <span th:text="${report.id}">1</span></p>
    <p><strong>제목:</strong> <span th:text="${report.title}">제목</span></p>
    <p><strong>내용:</strong> <span th:text="${report.content}">내용</span></p>
    <p><strong>처리상태:</strong> <span th:text="${report.status}">처리상태</span></p>
    <p><strong>등록일시:</strong> <span th:text="${report.createdAt}">2026-06-05T10:00</span></p>
</div>

<hr>

<div>
    <h2>관리자 답변</h2>

    <div th:if="${report.answer == null}">
        <p>아직 등록된 답변이 없습니다.</p>
    </div>

    <div th:if="${report.answer != null}">
        <p th:text="${report.answer}">답변내용</p>
        <p>
            <strong>답변일시</strong>
            <span th:text="${report.answeredAt}">2026-06-07T11:00</span>
        </p>
    </div>
</div>

<a th:href="@{/reports}">목록으로</a>
<a th:href="@{/}">메인으로</a>
</body>
</html>
